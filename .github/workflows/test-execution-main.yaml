name: Playwright Tests - Main

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - critical
          - regression

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Install dependencies
        run: |
          pnpm install
          cd tests && pnpm install
      
      - name: Install Playwright Browsers
        run: cd tests && pnpm exec playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run Playwright tests
        run: |
          cd tests
          if [ "${{ github.event.inputs.test_suite }}" = "smoke" ]; then
            pnpm run test:smoke --project=${{ matrix.browser }}
          elif [ "${{ github.event.inputs.test_suite }}" = "critical" ]; then
            pnpm run test:critical --project=${{ matrix.browser }}
          elif [ "${{ github.event.inputs.test_suite }}" = "regression" ]; then
            pnpm run test:regression --project=${{ matrix.browser }}
          else
            pnpm test -- --project=${{ matrix.browser }}
          fi
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:5173' }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/reports/
          retention-days: 30
      
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: tests/test-results/
          retention-days: 7
      
      - name: Upload trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ matrix.browser }}
          path: tests/test-results/
          retention-days: 7
  
  report:
    name: Generate Test Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      
      - name: Merge reports
        run: |
          echo "Test execution completed"
          ls -la all-reports/
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = `## 🎭 Playwright Test Results\n\n` +
              `Tests completed for commit ${context.sha.substring(0, 7)}\n\n` +
              `Check the [Actions tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed results.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
